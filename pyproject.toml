[build-system]
requires = [
    "scikit-build-core>=0.10",
    "VapourSynth>=74",
    "setuptools-scm>=8.0"
]
build-backend = "scikit_build_core.build"

[project]
name = "vapoursynth-grwrld"
description = "grayworld plugin for VapourSynth"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0"
license-files = ["LICENSE"]
authors = [{name = "grwrld Contributors"}]
keywords = ["vapoursynth", "grwrld", "video", "source"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Plugins",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Topic :: Multimedia :: Video",
]
dependencies = ["VapourSynth>=74"]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/Asd-g/AviSynthPlus-grayworld"
Issues = "https://github.com/Asd-g/AviSynthPlus-grayworld/issues"

[tool.scikit-build]
minimum-version = "0.10"
cmake.version = ">=3.28"
ninja.make-fallback = true
wheel.install-dir = "vapoursynth/plugins"
wheel.py-api = "py3"
sdist.reproducible = true
wheel.expand-macos-universal-tags = true
wheel.exclude = [
    # Exclude directories and their contents explicitly
    "**/bin/",              # Excludes the bin folder (and obudump)
    "**/include/",          # Excludes the include folder (headers)
    "**/lib/cmake/",        # Excludes the cmake config folder
    "**/lib/pkgconfig/",    # Excludes the pkgconfig folder
    "**/share/",            # Excludes share folder (man pages/docs, if any)

    # Exclude specific static library files
    "**/lib/*.a",           # Linux/macOS static libraries
    "**/lib/*.lib",         # Windows static libraries
    "**/*.lib",             # Catch-all for Windows static libs just in case
    "**/*.a"                # Catch-all for Unix static libs just in case
]

[tool.scikit-build.cmake.define]
BUILD_AVS_LIB = "OFF"
BUILD_VS_LIB = "ON"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
